name: Release

# Every merge to main publishes a numbered GitHub Release with Linux and Windows installers,
# once CI has passed on that commit. (main only changes through PRs, so "push to main" means
# "a PR was merged".) Pull requests that touch packaging run the same builds without publishing.
#
# Version: <major>.<minor> from src-tauri/tauri.conf.json, then a patch number that restarts at 0
# for each minor version: the number of main's own commits (first parents, i.e. one per merged
# PR) since the version in tauri.conf.json became <major>.<minor>. The merge that bumps the
# version is released as <major>.<minor>.0 (tag v<major>.<minor>.0), the next merge as .1, and
# so on, whether PRs are merged, squashed or rebased. No tag needs creating by hand. Purely
# numeric, so it's valid for semver, .deb, .rpm and .msi, and it always increases because main
# can't be force-pushed. 0.2 predates this and keeps counting from its "v0.2" marker tag, so its
# numbers never go backwards; don't create marker tags for newer versions. See docs/DECISIONS.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/build.rs
      - src-tauri/windows-app-manifest.xml
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Decide version
    # Only release commits that landed on main in this repo and passed CI.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the commit count is part of the version
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json)
          major_minor="${base%.*}"
          marker="v$major_minor"
          if git rev-parse -q --verify "refs/tags/$marker" >/dev/null; then
            # Legacy marker tag (only v0.2): commits since the tag.
            patch=$(git rev-list --count "$marker..HEAD")
          else
            # Walk main's first-parent history back to where this minor version began.
            patch=-1
            for commit in $(git rev-list --first-parent HEAD); do
              v=$(git show "$commit:src-tauri/tauri.conf.json" 2>/dev/null | jq -r .version 2>/dev/null || true)
              [ "${v%.*}" = "$major_minor" ] || break
              patch=$((patch + 1))
            done
          fi
          version="$major_minor.$patch"
          tag="v$version"
          build=true
          publish=false
          if [ "$EVENT" = workflow_run ] || { [ "$EVENT" = workflow_dispatch ] && [ "$REF" = refs/heads/main ]; }; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::$tag is already released; nothing to do."
              build=false
            else
              publish=true
            fi
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::version $version (publish: $publish)"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installers
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '{"version":"%s"}\n' "$VERSION" > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/release.conf.json"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p installers
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} installers/ \;
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Omarss $VERSION" \
            --latest \
            --generate-notes \
            --notes "Built automatically from main at $SHA.

          Installers: Linux \`.AppImage\`, \`.deb\` and \`.rpm\`; Windows \`-setup.exe\` (NSIS) and \`.msi\`. The Windows installers are not code-signed yet, so SmartScreen may warn on first run."
