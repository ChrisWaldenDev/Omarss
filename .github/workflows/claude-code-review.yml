name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push replaces a review still in progress (saves usage on quick fix-ups).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are reviewed once marked ready. Fork PRs get no secrets, so skip them cleanly.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The PR merge commit and its parents: `git diff HEAD^1 HEAD` is the PR's change.
          fetch-depth: 2
          # The reviewer can read files, so don't leave a token in .git/config.
          persist-credentials: false

      # Milestone PRs are large (100+ files, 10k+ lines): a single `gh pr diff` gets truncated,
      # so the reviewer needs read-only access to the checked-out code and file-by-file diffs.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*)"
            --append-system-prompt "Large pull requests: this repository merges whole milestones at once,
            so a PR can change 100+ files and 10,000+ lines, and a single gh pr diff output is truncated
            at that size. Do not rely on it. Instead list the changed files with gh pr diff NUMBER
            --name-only, split them between the review agents, inspect the changes in each file with
            git diff HEAD^1 HEAD -- PATH (the checkout is the PR merge commit and its first parent is
            the base branch), and read surrounding code with Read, Grep and Glob. Skip generated and
            data files: src/lib/types.ts, package-lock.json, src-tauri/Cargo.lock, src-tauri/gen/,
            src-tauri/icons/ and src-tauri/src/tests/fixtures/. Pass these instructions to every
            subagent you launch."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The review job succeeds even when Claude stops without reviewing (it decided the PR needs
      # no review, or it gave up), so say so instead of leaving a misleading green check.
      - name: Check that a review was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count() {
            gh api --paginate "$1" --jq '[.[] | select(.user.login == "claude[bot]")] | length' |
              awk '{ total += $1 } END { print total + 0 }'
          }
          comments=$(count "repos/$GITHUB_REPOSITORY/issues/$PR/comments")
          inline=$(count "repos/$GITHUB_REPOSITORY/pulls/$PR/comments")
          echo "Claude comments on this PR: $comments summary, $inline inline"
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::warning title=No Claude review posted::Claude finished without commenting on this PR. Re-run this job to try again."
          fi
