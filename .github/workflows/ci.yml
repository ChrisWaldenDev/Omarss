name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Docs-only PRs (Markdown, docs/, LICENSE) skip the slow app jobs. Anything else,
          # and every push to main (which gates releases and fills the build caches), runs them.
          app=true
          if [ "$EVENT" = pull_request ]; then
            # A PR checks out its merge commit; its first parent is the base branch.
            changed=$(git diff --name-only HEAD^1 HEAD)
            printf 'Changed files:\n%s\n' "$changed"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
              app=false
              echo "::notice::Docs-only change; skipping the app jobs."
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test

  app:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # `cargo test` regenerates src/lib/types.ts; committed bindings must match the Rust code.
      - name: Check generated TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- src/lib/types.ts

      - name: Build app
        run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@v7
        with:
          name: omarss-${{ runner.os }}
          path: |
            src-tauri/target/release/omarss
            src-tauri/target/release/omarss.exe
          if-no-files-found: error
          retention-days: 14
